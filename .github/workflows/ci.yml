name: CI

# dev pushes are already gated by the Preview build in Workers Builds; this covers PRs before they merge.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      # Test fixtures are generated and ASS subtitles converted with ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:tools
      # Development mode needs no environment secrets; preview/production builds stay in Workers Builds.
      - run: pnpm build
